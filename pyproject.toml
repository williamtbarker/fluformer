[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluformer"
version = "0.1.1"
description = "Reusable temporal protein-modeling components for influenza sequence modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "William Barker"}]

dependencies = [
  "numpy>=1.26",
  "torch>=2.1",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

benchmark = [
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]

[project.scripts]
fluformer = "fluformer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["fluformer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fluformer"]
